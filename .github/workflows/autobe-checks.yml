name: AutoBE checks

on:
  push:
    paths:
      - "autobe-activity/**"
      - ".github/workflows/autobe-checks.yml"
  pull_request:
    paths:
      - "autobe-activity/**"
      - ".github/workflows/autobe-checks.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: autobe-activity

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: autobe-activity/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
