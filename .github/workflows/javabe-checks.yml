name: JavaBE Activity CI

on:
  pull_request:
    paths:
      - "JavaBE/**"
      - ".github/workflows/javabe-checks.yml"
  push:
    branches:
      - main
      - "feature/javabe-discord-activity"
    paths:
      - "JavaBE/**"
      - ".github/workflows/javabe-checks.yml"

concurrency:
  group: javabe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JavaBE Activity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JavaBE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Activity
        run: pnpm build
      - name: Setup Java 17 for the source dependency
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle for the source dependency
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3'
      - name: Checkout Serious Player Animations 1.1.1 source
        run: git clone --depth 1 --branch 1.1.1 https://github.com/McVader34/Serious-Player-Animations.git /tmp/serious-player-animations
      - name: Build the verified Serious Player Animations 1.1.1 source dependency
        run: gradle :fabric:remapJar --no-daemon --stacktrace
        working-directory: /tmp/serious-player-animations
      - name: Export the source dependency JAR path
        run: |
          jar_path="$(find /tmp/serious-player-animations/fabric/build/libs -maxdepth 1 -type f -name 'seriousplayeranimations-1.1.0.jar' | head -n 1)"
          test -n "$jar_path"
          echo "SERIOUS_PLAYER_ANIMATIONS_JAR=$jar_path" >> "$GITHUB_ENV"
      - name: Run player Molang baseline regression
        run: node scripts/run-player-baseline-regression.mjs
      - name: Convert the original Pierced fixture through the current animation engine
        run: node scripts/run-pierced-animation-regression.mjs
      - name: Upload current Pierced conversion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javabe-pierced-current-engine
          path: fixture-analysis/pierced-current-engine.json
          if-no-files-found: warn
