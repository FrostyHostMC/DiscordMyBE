name: Project V PS4 Manager CI

on:
  workflow_dispatch:
  push:
    branches: [project/gtav-autoport]
    paths:
      - "GTAV-AutoPort/**"
      - ".github/workflows/gtav-autoport.yml"

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GTAV-AutoPort
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run JavaScript tests
        run: npm test
      - name: Build web application
        run: npm run build

  verify-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test native resource inspector
        working-directory: GTAV-AutoPort/native-inspector
        run: cargo test
      - name: Build native resource inspector
        working-directory: GTAV-AutoPort/native-inspector
        run: cargo build --release

  verify-ragekit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Configure pinned ragekit backend
        working-directory: GTAV-AutoPort
        run: cmake -S native-engine -B build/ragekit -DCMAKE_BUILD_TYPE=Release
      - name: Build ragekit CLI backend
        working-directory: GTAV-AutoPort
        run: cmake --build build/ragekit --config Release --target rk --parallel 2
      - name: Exercise nested RPF archive listing and extraction
        working-directory: GTAV-AutoPort
        run: |
          RK_BIN="$(find build/ragekit -type f -name rk -perm -111 | head -n 1)"
          test -n "$RK_BIN"
          node scripts/rpf-cli-integration.mjs "$RK_BIN"

  verify-runtime-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable runtime core
        working-directory: GTAV-AutoPort
        run: cmake -S native-runtime -B build/native-runtime -DCMAKE_BUILD_TYPE=Release
      - name: Build and test portable runtime core
        working-directory: GTAV-AutoPort
        run: cmake --build build/native-runtime --parallel 2 && ctest --test-dir build/native-runtime --output-on-failure

  verify-ps4-app-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native PS4 platform modules with host compiler
        working-directory: GTAV-AutoPort/ps4-app
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc/platform \
            tests/platform_host_tests.cpp \
            src/platform/library.cpp src/platform/goldhen_config.cpp \
            src/platform/compatibility_profiles.cpp \
            ../project-v-runtime/src/signature_gate.cpp \
            -o "$RUNNER_TEMP/ps4-platform-tests"
      - name: Run PS4 platform regression tests
        run: "$RUNNER_TEMP/ps4-platform-tests"

  build-ps4-pkg:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: GTAV-AutoPort/ps4-app
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl libicu-dev clang lld imagemagick python3
      - name: Install pinned OpenOrbis v0.5.4
        run: |
          curl -fL --retry 3 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o "$RUNNER_TEMP/oo.tar.gz"
          mkdir -p "$RUNNER_TEMP/oo"
          tar -xzf "$RUNNER_TEMP/oo.tar.gz" -C "$RUNNER_TEMP/oo"
          ROOT="$(dirname "$(find "$RUNNER_TEMP/oo" -name link.x -type f | head -1)")"
          test -f "$ROOT/link.x"
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> "$GITHUB_ENV"
          echo "$ROOT/bin/linux" >> "$GITHUB_PATH"
      - name: Generate PS4 icon
        run: convert -background none sce_sys/icon0.svg -resize 512x512! PNG24:sce_sys/icon0.png
      - name: Build native EBOOT and installable PKG
        run: |
          make clean
          make
          test -s eboot.bin
          test -s IV0000-AUPT00001_00-AUTOPORTPS400000.pkg
      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: ProjectV-PS4-PKG
          path: |
            GTAV-AutoPort/ps4-app/*.pkg
            GTAV-AutoPort/ps4-app/eboot.bin
          if-no-files-found: error
          retention-days: 90
