name: GTAV AutoPort CI

on:
  workflow_dispatch:
  push:
    branches: [project/gtav-autoport]
    paths:
      - "GTAV-AutoPort/**"
      - ".github/workflows/gtav-autoport.yml"
  pull_request:
    paths:
      - "GTAV-AutoPort/**"
      - ".github/workflows/gtav-autoport.yml"

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GTAV-AutoPort
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run JavaScript tests
        run: npm test
      - name: Build web application
        run: npm run build

  verify-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test native resource inspector
        working-directory: GTAV-AutoPort/native-inspector
        run: cargo test
      - name: Build native resource inspector
        working-directory: GTAV-AutoPort/native-inspector
        run: cargo build --release
