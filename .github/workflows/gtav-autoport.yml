name: GTAV AutoPort CI

on:
  workflow_dispatch:
  push:
    branches: [project/gtav-autoport]
    paths:
      - "GTAV-AutoPort/**"
      - ".github/workflows/gtav-autoport.yml"
  pull_request:
    paths:
      - "GTAV-AutoPort/**"
      - ".github/workflows/gtav-autoport.yml"

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GTAV-AutoPort
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run JavaScript tests
        run: npm test
      - name: Build web application
        run: npm run build

  verify-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test native resource inspector
        working-directory: GTAV-AutoPort/native-inspector
        run: cargo test
      - name: Build native resource inspector
        working-directory: GTAV-AutoPort/native-inspector
        run: cargo build --release

  verify-ragekit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Configure pinned ragekit backend
        working-directory: GTAV-AutoPort
        run: cmake -S native-engine -B build/ragekit -DCMAKE_BUILD_TYPE=Release
      - name: Build ragekit CLI backend
        working-directory: GTAV-AutoPort
        run: cmake --build build/ragekit --config Release --target rk --parallel 2
      - name: Exercise nested RPF archive listing and extraction
        working-directory: GTAV-AutoPort
        run: node scripts/rpf-cli-integration.mjs build/ragekit/rk
