name: GTAV AutoPort CI

on:
  push:
    branches: [project/gtav-autoport]
    paths:
      - "GTAV-AutoPort/**"
      - ".github/workflows/gtav-autoport.yml"
  pull_request:
    paths:
      - "GTAV-AutoPort/**"
      - ".github/workflows/gtav-autoport.yml"

defaults:
  run:
    working-directory: GTAV-AutoPort

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GTAV-AutoPort/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
