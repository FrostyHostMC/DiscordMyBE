  <style>
    /* Disable pinch zoom on iOS - touch-action: manipulation prevents double-tap and pinch zoom */
    html,
    body {
      touch-action: manipulation;
      background-color: #07050F;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
    }

    #root {
      height: 100vh;
      height: 100dvh;
    }

    /* Disable text selection and iOS long-press callout */
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Inputs must stay selectable/editable on mobile */
    input,
    textarea,
    [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
  <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS COMMENT!  START 👇 -->
