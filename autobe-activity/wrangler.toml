name = "autobe-activity"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[vars]
VITE_DISCORD_CLIENT_ID = "1471599214717829120"
DISCORD_CLIENT_ID = "1471599214717829120"
DISCORD_GUILD_ID = "1561951163065180251"
DISCORD_REQUIRED_ROLE_ID = "1561952044498030593"
DISCORD_OAUTH_REDIRECT_URI = "https://discordmybe.pages.dev/"

 # Optional: set to your public site URL (e.g. https://autobe-activity.pages.dev)
 # if download links come back with the wrong host.
 PUBLIC_BASE_URL = "https://discordmybe.pages.dev"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "autobe-modpacks"

[[d1_databases]]
binding = "DB"
database_name = "autobe-community-modpacks"
database_id = "87c441f7-ef60-4478-a337-57cc02dcabbb"

# Preview deployments must never share production storage or community data.
[[env.preview.r2_buckets]]
