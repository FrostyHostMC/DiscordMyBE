name = "autobe-community-maintenance"
main = "src/index.ts"
compatibility_date = "2026-11-11"\n\n[vars]\nDISCORD_GUILD_ID = "1561951163065180251"\nDISCORD_REQUIRED_ROLE_ID = "1561952044498030593"

[triggers]
crons = ["0 4 * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "autobe-modpacks"

[[d1_databases]]
binding = "DB"
database_name = "autobe-community-modpacks"
